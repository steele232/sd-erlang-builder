# Deviation register.
#
# Every known difference between the layers S (design), M (semantics) and
# I (19.3 implementation), and every intentional difference a port introduces
# relative to I. A port is "historically faithful" iff its differential traces
# match I except for entries here with `port_policy: may_differ` that a human
# has approved. Changes to this file are oracle changes: never in the same
# change as production code (handoff guide, "AI may never modify the oracle").
#
# fields:
#   id, layers (which pair differs), source, summary
#   fidelity_target: I | M | S          what a port must reproduce
#   port_policy: must_match | may_differ | undecided
#   normalization: how the differential harness compares it (if anything)

- id: R1
  layers: [M, I]
  source: AST14 §5
  summary: send/3 on unknown name returns {badarg, {Group, Name, Msg}}; M says undefined
  fidelity_target: I
  port_policy: must_match
  normalization: none

- id: R2
