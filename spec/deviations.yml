- id: Q3
  layers: [S, M, I]
  source: trace_replay on 19.3-exp-fixed3 (pbt-20261017T153218Z-fail.eterm, step 14 add_nodes(g6, ...))
  summary: >-
    After add_nodes, a member's global known list for g6 contained non-members
    (the hidden harness driver, and a free node n12) and had lost a real member (n11).
  root_cause: >-
    global:replace_no_group/2 (called on node-up paths when a free node joins a
    group) RENAMES the free partition's whole no_group known/synced list to the
    group via lists:keyreplace(no_group, ...). That imports every free-partition
    node (including hidden nodes there via H2), and if the group already had an
