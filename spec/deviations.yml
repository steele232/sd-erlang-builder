- id: O5
  layers: [S, M, I]
  source: observed (bin/sd-demo15 repro, 3/3 boots)
  summary: >-
    group-scoped registration multicasts only to global:get_known_s_group/1 at that
    instant. If it lands while global is part-way through syncing a freshly formed
    group, the name can stay missing on some members permanently; s_group:sync/0
    does not repair it. Registering before any sync, or after sync completes, is fine.
  evidence: >-
    demo15 boot repro 3/3 boots; sd-pbt shrunk counterexample (new_s_group over 7
    nodes, then re_register_name); sd_pbt_o5:run(20, 120000) on 19.3: 17/20
    converged in 106-1421 ms, 3/20 never converged in 120 s (2-3 of 7 holders).
    Distinct from R3 (D3.3 reports eventual convergence after 60 s).
  mechanism_investigation: >-
    (1) snapshot-vs-known window (spec/tla/SGroupNames.tla): ruled out by code
    reading; registration and sync share the ?GLOBAL_RID lock on the registrant.
    (2) foreign-name GC with a lagging global view (SGroupForeignGC.tla):
    REFUTED at runtime; 0/6 and 0/7 never-converged trials had any lagging member.
    (3) stuck knowledge (O5 = Q1): REFUTED at runtime; the registrant's
    known(g3) was complete at the end in 7/7 never-converged trials.
    Data: 6/25 and 7/25 trials never converge (cap 30 s). Typically only the
    registrant plus one node hold the name; a whole sub-partition of 5 members
    never gets it, while all membership knowledge is complete.
    (4) ROOT CAUSE (confirmed by global high-level trace of a failing trial,
    test-results/pbt/o5-trace.bin via sd_pbt_o5:trace_failure/1, plus a code diff
    against the stock base 5da9e0ab). After a pairwise sync, stock
    global:resolved/5 abcasts {new_nodes, node(), Ops, ..., [Node|HisKnown], ...}
    to its OWN partition (Known), Ops being the names it just learned. SD's
    resolved_s/6 sends {new_nodes_s, ...} via new_nodes_f(CmbNodeSGroups, ...),
    where CmbNodeSGroups is built from HisCmnKnown, the PEER's partition. Its own
    partition therefore never receives the learned names. The trace label still
    says {abcast, CmnKnownNodes}, showing the intended target.
    Failing trial: registrant n4 (alone) synced with n10 of an already-formed
    partition {n3,n5,n6,n7,n9,n10}; n10 learned b, while the other five got
    new_nodes_s from n4 with {ops, []} and recorded {added,[n4]} without ins_name.
    Fix for a port: per common group, broadcast to own known members with the
    peer side [Node | HisCmnKnown(G)] as new nodes (stock pattern).
    MODEL: spec/tla/SGroupMerge.tla. Mode sd193 reproduces the runtime failure
    shape (registrant + one holder); mode stock satisfies NamespaceConvergence,
    Symmetric, PartitionTables and <>AllKnown at 4 nodes.
    VERIFIED BY INTERVENTION: patches/experimental/0001-resolved_s-broadcast-to-own-partition.patch
    (one function), image localhost/sd-erlang:19.3-exp-merge-fix (never an oracle).
    sd_pbt_o5:run(25, 30000): reference 13/50 never converge (6/25 + 7/25);
    patched 0/25 never (max 432 ms). One-sided Fisher exact p ~ 0.006.
    L4 regression gate: campaign 10x50 on the patched image gave
    {not_quiescent,new_s_group} in 6/10 runs vs 3/20 on the pooled reference
    (p = 0.018). VERDICT WITHDRAWN: later reference campaigns under newer harness
    versions gave 5/10 and 6/9 for the same kind (censoring and drift; see
    VERIFICATION_STRATEGY L4), so the comparison was not like-for-like. To be
    settled by the interleaved A/B campaign (bin/sd-pbt-ab).
    INTERLEAVED A/B (10 rounds, pinned harness d246e586/f93ba915, source
    d974847): {not_quiescent,new_s_group} reference 1/10 vs fix 8/10, one-sided
    Fisher p = 0.003 -> fix 0001 REJECTED. It also removed O6-style c2_namespace
    failures (2/10 -> 0/10; not significant). Some members never complete any group sync (e.g. n1,n5,n9
    isolated in g2). Retargeting the broadcast without stock's full merge protocol
    (symmetric partition broadcasts and lock cancellation for the peer's nodes)
    abandons in-flight syncs. Lesson for the port: implement the stock merge
    semantics whole (design B), not by piecemeal patching.
  fidelity_target: S
  port_policy: may_differ        # a port may fix this; the fix must be shown by sd_pbt_o5 on both runtimes
  normalization: >-
    the quiescent PBT mode waits for global group knowledge to complete before each
    command, so a registration multicasts to every member and this race cannot fire
    from a registration. Note: complete knowledge does NOT imply consistent name
    tables (see mechanism (3)), so quiescence is a scheduling aid, not a proof of
    convergence. The eager mode is EXPECTED_FAIL on 19.3.

# ---- found by bin/sd-pbt (PropEr conformance vs. 19.3) ----

- id: I1
  layers: [M, I]
  source: sd-pbt 2026-10-16 (shrunk: add_nodes(g1, [n3]) on n3, g1 absent); s_group.erl add_nodes/2
  summary: >-
    add_nodes/2 removes node() from the list first; if nothing is left it returns
    {ok, Group, []} without checking that the caller is a member or that the group
    exists. M says Error for a non-member. State is unchanged in both.
  fidelity_target: I
  port_policy: must_match
  normalization: when usort(Nodes) -- [Caller] == [], {ok, G, []} maps to M's error (no state change)

- id: Q1
  layers: [S, M, I]
  source: sd-pbt quiescent run 2026-10-16 (test-results/pbt/pbt-20261017T062607Z-fail.eterm)
  summary: >-
    After new_s_group over 9 nodes, membership and connections conformed, but
    global on one member (n7) never synced with the rest of the group within
    10 s (get_known_s_group/1 empty both ways). Every later registration in the
    group would miss that node. Resembles RELEASE R4 ("expected nodeup never
    arrived"), which RELEASE reported fixed.
  evidence: 1 occurrence in ~76 cases (~760 commands); 0/30 deterministic replays (rare race); 2/10 runs in campaign 2
  hypothesis: >-
    global.erl (0fdfcf28) the_locker_message({his_the_locker,...}) waits up to
    60000 ms for a matching nodeup, then logs "global: nodeup never came" and
    carries on. That matches RELEASE R3 ("identical after a 60s timeout and an
    error report"). Prediction: Q1 cases converge at ~60 s. Test: campaign with
    SD_PBT_CONVERGE_MS=75000; if they converge, Q1 is R3 reproduced (slow, not
    permanent).
  r3_test: >-
    REFUTED as R3: campaign with SD_PBT_CONVERGE_MS=75000 (10x50) still ended
    {not_quiescent,new_s_group} in 5/10 runs, so the stuck syncs outlast the 60 s
    "nodeup never came" recovery path. Typical shape: the new_s_group creator and
    one other member never sync with the other members (e.g. n4, n8 in g6),
    while the rest form a partition.
  evidence_capture: >-
    At a Q1 failure (pbt-20261017T145222Z-fail.eterm, new_s_group(g3, ...) by n8),
    the stuck nodes had NO held global locks, idle lockers and empty queues, so it
    is not a stuck lock. The newly created group g3 was fully known; the
    incomplete knowledge was in g6, a PRE-EXISTING group shared by the same
    nodes (n12 knew only [n6] in g6). The previous quiescence check passed, so
    g6 knowledge was complete before the command.
  refuted: >-
    (a) R3 60 s path (5/10 still stuck at 75 s); (b) stuck global locks
    (none held); (c) simple Q2-class logical disconnect on group creation:
    test/pbt/sd_pbt_q1.erl with 2 and 3 shared g6 members, via new_s_group and
    add_nodes, 0/20 lost knowledge (too simple: the re-learn came via a direct
    sync, which recomputes all common groups).
  ROOT_CAUSE: >-
    CONFIRMED BY INTERVENTION. Same class as Q2: SD's logical disconnect
    (s_group:disconnect_nodes/1 -> global nodedown) of nodes that still share
    ANOTHER group wipes global's knowledge in that other group; only the new
    group is re-synced, and the node is re-learned transitively via
    new_nodes_s, which carries only that sync's groups. The locker's flat known
    list then suppresses any direct re-sync, so it is permanent.
    Evidence: captured replay of pbt-20261017T145222Z-fail.eterm on the image
    with 0002+0004 (where Q1 shows in 4/10 replays): g6 known/synced on 4 nodes
    COMPLETE before step 12 (new_s_group g3) and partially wiped after it.
    Disconnect sites: handle_call new_s_group (initiator, NodesToDisconnect),
    new_s_group_check, add_nodes, add_nodes_check.
    Fixes: 0005 (receiver sites + add paths only): still 4/10. 0006 (adds the
    initiator site): 10/10 pass. Combined image localhost/sd-erlang:19.3-exp-fixed3.
  failure_shapes: >-
    Across 30 stored not_quiescent failures: 24 show only MUTUAL non-knowledge
    (pairs that never completed a sync); 6 show asymmetric pairs (a knows b,
    b does not know a). The asymmetric minority is the shape SGroupMerge.tla
    (mode sd193) predicts; the mutual majority fits the stuck-locker / 60 s
    hypothesis.
  fidelity_target: S
  port_policy: may_differ        # a port may fix it; frequency is tracked by `bin/sd-pbt campaign`
  normalization: none (counts as a failure kind in campaign profiles)

- id: I2
  layers: [M, I]
  source: sd-pbt campaign 2026-10-16 run 2 (pbt-20261017T062946Z-fail.eterm); s_group.erl handle_call remove_nodes
  summary: >-
    remove_nodes/2 removes the intersection of the given list with the group's
    members and returns ok when the caller is a member and not in the list. M
    returns False (no change) unless every listed node is a member.
  fidelity_target: I
  port_policy: must_match
  normalization: test/pbt/sd_pbt_impl.erl step(remove_nodes)

- id: Q2
  layers: [S, M, I]
  source: sd-pbt campaign 2 run 6 (pbt-20261017T063946Z-fail.eterm); deterministic repro test/pbt/sd_pbt_q2.erl
  summary: >-
    Removing a node from one s_group breaks global's knowledge of it in another
    overlapping s_group. With g1={A,B,C}, g2={B,C}, A:remove_nodes(g1,[C]) leaves B
    and C still members of g2 and still connected, but get_known_s_group(g2) is []
    on both, so later g2 registrations cannot replicate between them. Violates S1/S4
    (groups are independent) and crash/change isolation.
  root_cause: >-
    s_group.erl handle_call({remove_nodes_check, ...}) calls
    disconnect_nodes(NodesToRmv) unconditionally (global nodedown for every removed
    node). The initiator's path computes NodesKeepConnected (nodes still shared via
    other groups) and disconnects only the rest; the check path does not.
  evidence: sd_pbt_q2:run(5) on 19.3 -> 5/5 lost
  experimental_fix: >-
    patches/experimental/0002-remove_nodes_check-keep-shared-nodes.patch. Targeted:
    sd_pbt_q2 0/5 lost. Regression gate: {not_quiescent,new_s_group} 4/10 vs 3/20
    pooled reference, p = 0.14, not significant. Provisionally accepted as the fix
    design for a port.
  fidelity_target: S
  port_policy: may_differ        # a port should fix it; sd_pbt_q2 must report 0/N on the port
  normalization: failure kind {not_quiescent, remove_nodes} in campaign profiles

- id: O6
  layers: [S, M, I]
  source: sd-pbt campaign 2 run 1 (pbt-20261017T063504Z-fail.eterm)
  summary: >-
    A name registered in a group before add_nodes/2 never reached one of the newly
    added members (n7 of n3,n7,n9) within 10 s, while the others received it.
    Join-time back-fill can be lost. The TLA+ model SGroupNames does not cover
    it: the name predates the sync, so the snapshot hypothesis does not explain it.
    Most likely the same root cause as O5 (resolved_s broadcasts learned names to
    the peer's partition instead of its own): newly added members that first
    synced among themselves form a partition; it merges with the name holders
    through one pair, and the rest of that partition never gets the names.
    Not yet confirmed by trace for O6 specifically.
  evidence: 1/10 campaign runs (10x50 cases, quiescent mode)
  fidelity_target: S
  port_policy: may_differ
  normalization: failure kind {conformance, add_nodes, [c2_namespace]} in campaign profiles

