# Honest status of each verification oracle named in the handoff guide.
historical_quickcheck:
  source: not found
  searched: >-
    `git grep eqc_statem|prop_s_group|new_s_group_next_state` over every branch of
    release-project/otp (17.4-rebased, 19.2-rebased, 19.3-rebased, dev, repair,
    sd-erlang-tutorial, master) on 2026-10-16; only stock OTP eqc suites matched.
  executable: no
  reason: the D3.3 eqc_statem model is not in the public source mirror
proper_port:
  executable: yes
  location: test/pbt/sd_pbt_statem.erl (bin/sd-pbt)
  model: spec/model/sd_model.erl (executable transcription of D3.3 ch. 4; errata in spec/model/ERRATA.md)
  status: >-
    reconstruction of the D3.3/AST'14 eqc_statem setup (14 nodes, 12 normal + 2 hidden,
    Fig. 5.4 weights). Not the original model. Quiescent-mode campaign on 19.3
    (10x50): 7 pass; failures all registered (O6, Q1, Q2).
tla_model:
  executable: yes
  location: spec/tla/SGroupNames.tla (bin/sd-tla)
  status: reproduces the O5 mechanism shape; lock/backfill fixes verified at 3 nodes x 2 names
demo_scenario:
  executable: yes
  location: demo/src/sd_demo_scenario.erl
  scope: >-
    3-node smoke-level semantic checks (membership, non-transitive connectivity,
    group-scoped names, add/remove/new/delete, crash isolation, restart recovery).
    This is NOT the published QuickCheck model and must not be described as such.
differential_control:
  stock_runtime: release-project/otp master = 5da9e0ab5cb96f2cb37e534b2c1a55c0c2c9783c
  note: exact parent of the SD commit, so the only source difference is the s_group patch

last_local_run:
  date: 2026-10-16
  host: macOS arm64, podman 5.7.0 (applehv VM), builder trusty arm64v8
  sd_scenario: 10/10 pass
  stock_control: 2/2 pass (gpu1 meshed to connector transitively in ~200 ms)
demo15:
  sd_scenario: 10/10 pass on 3 consecutive fresh clusters
  stock_control: 105 visible links vs 35 under SD (same seeds)
  boot_registration_repro: diverged on 3/3 fresh boots (control group only)
observed_historical_behaviours:
  - connections between nodes sharing no group are allowed but hidden; they stay hidden after a later join
  - add_nodes/2 creates such a hidden link to the added node
  - a local name-lookup miss searches other groups and leaves hidden links
  - group-scoped registration reaches only global's known set at that instant; early registrations can stay missing (s_group:sync/0 does not repair)
  - remove_nodes/2 performs a logical disconnect only; the distribution link may persist
  - pid of a restarted node can compare equal to the pre-crash pid (OTP 20 2-bit creation)
port_prototype_otp29:
  runtime: localhost/sd-erlang:29.1.2-sdx-proto (port/sdx, library-only, stock 29.1.2)
  date: 2026-10-17
  demo3: 10/10 (SD_DEMO_RUNTIME/SD_DEMO_IMAGE/SD_DEMO_ERL_FLAGS; 19.3 re-checked 10/10 with the same demo sources)
  demo15: 10/10 (19.3 re-checked 10/10)
  l1: 200/200 with C4 (SD_PBT_VISIBILITY=1) after the monitor and join-race fixes; earlier 100/100 after R-TOP-3 free_mesh; before it, counterexample test/corpus/l1-sdx-freemesh.eterm (0/10 replays; 10/10 with prevent_overlapping_partitions false too, so not UD1)
  p18: 6/11 lines differ from 19.3 (R-API-5, needs kernel hook)
  found_by_l3: [R-NS-5 merge on join (demo15), demo harness used 19.3-only global:whereis_name/2 and global:get_known_s_group/1]
  l5: connect_all false 1/20; connect_all true 19/20 (UD2 only, pid-blind equal); control without s_group 20/20
  c4_baseline_19.3_fixed6: clean (19 pass + 1 not_quiescent of 20)
  regression_cases: [test/corpus/l1-sdx-freemesh.eterm, test/corpus/l1-c4-joinrace.eterm]
